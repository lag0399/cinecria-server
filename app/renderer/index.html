<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0c0c14" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob: http: https:; media-src 'self' blob: mediastream: http: https:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src * ws: wss: http: https:;" />
  <title>Cinecria Beta</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="stylesheet" href="styles.css" />
  <!-- socket.io client: do node_modules (Electron) com fallback para o servidor (modo navegador) -->
  <script src="../node_modules/socket.io-client/dist/socket.io.min.js"></script>
  <script src="js/vendor-fallback.js"></script>
  <script src="js/config.js"></script>
  <script src="js/rtc.js"></script>
</head>
<body>
  <!-- ============ Entrada: apelido + foto ============ -->
  <section id="login" class="login">
    <div class="login-glow"></div>
    <div class="login-card">
      <div class="brand">
        <div class="brand-logo" id="brandLogo"></div>
        <div>
          <h1><span>Cinecria</span><span class="beta-badge">Beta</span></h1>
          <p>Sua sala de cinema com os amigos.</p>
        </div>
      </div>

      <div class="avatar-pick stacked" id="loginAvatar">
        <button class="avatar-big" type="button" title="Trocar foto"><img alt="" /><span class="av-edit">Trocar</span></button>
        <div class="avatar-side">
          <div class="presets"></div>
          <div class="av-cards">
            <button class="av-card up-card av-upload" type="button">
              <span class="up-ico" data-ico="folder"></span><b>Enviar do dispositivo</b><small>PNG, JPG, WebP ou GIF</small>
            </button>
            <button class="av-card gif-card av-gif" type="button">
              <span class="gif-mosaic"><i></i><i></i><i></i><i></i></span>
              <span class="gif-card-label"><span class="gif-chip">GIF</span><b><span data-ico="sparkles"></span>Escolher GIF</b></span>
            </button>
          </div>
          <input type="file" class="av-file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
        </div>
      </div>

      <label class="field">
        <span class="label">Apelido</span>
        <input id="nick" maxlength="32" placeholder="Como seus amigos vão te ver" autocomplete="off" spellcheck="false" />
        <small class="field-hint">Único entre quem está online agora.</small>
      </label>

      <div class="srv-lock" id="srvLock">
        <span class="srv-lock-ico" data-ico="lock"></span>
        <span class="srv-lock-txt"><small>Servidor oficial</small><code id="srvHost"></code></span>
        <span class="srv-status" id="srvStatus"><i></i><span>verificando…</span></span>
      </div>

      <details class="adv">
        <summary>Servidor Cinecria</summary>
        <input id="srvUrl" placeholder="IP do PC, ex.: 192.168.0.10" spellcheck="false" autocapitalize="off" inputmode="url" />
        <div class="srv-tools">
          <button type="button" class="chip" id="srvTest">Testar conexão</button>
          <button type="button" class="chip native-only" id="srvEmu">Emulador Android</button>
        </div>
        <small class="srv-hint" id="srvHint"></small>
      </details>

      <button class="btn primary big" id="enterBtn" type="button">Entrar</button>
      <p class="err" id="loginErr"></p>
    </div>
  </section>

  <!-- ============ Interface principal ============ -->
  <div id="app" class="app hidden">
    <header id="rail" class="topbar"></header>
    <aside class="sidebar">
      <div id="srvHeader"></div>
      <div id="channels" class="channels"></div>
      <div id="voicePanel" class="voice-panel hidden"></div>
      <div id="userPanel" class="user-panel"></div>
    </aside>
    <main id="main" class="main"></main>
    <aside id="members" class="members"></aside>
  </div>

  <div id="drawerBack" class="drawer-back"></div>
  <div id="modalRoot"></div>
  <div id="toasts" class="toasts"></div>
  <div id="audioSink" hidden></div>

  <script src="js/app.js"></script>
</body>
</html>
